[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-redteam-evidence"
version = "0.2.0"
description = "Turn LLM red-team results (garak, promptfoo) into audit evidence, OSCAL and a model release gate"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Mihir Ajmera" }]
dependencies = ["pyyaml>=6.0,<7"]
keywords = ["ai-security", "llm-security", "red-teaming", "garak", "promptfoo", "owasp-llm-top-10", "mitre-atlas", "nist-ai-rmf", "oscal", "grc"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Intended Audience :: Information Technology",
]

[project.urls]
Homepage = "https://github.com/Mihirajmera/llm-redteam-evidence"
Issues = "https://github.com/Mihirajmera/llm-redteam-evidence/issues"

[project.scripts]
redteam-evidence = "redteam_evidence.__main__:main"

[tool.setuptools]
packages = ["redteam_evidence", "redteam_evidence.examples", "redteam_evidence.examples.v1", "redteam_evidence.examples.v2"]

[tool.setuptools.package-data]
redteam_evidence = ["*.yaml"]
"redteam_evidence.examples" = ["*.md"]
"redteam_evidence.examples.v1" = ["*"]
"redteam_evidence.examples.v2" = ["*"]
