name: Tests

on:
  push: {branches: [main]}
  pull_request: {}
  workflow_dispatch: {}

permissions: {contents: read}

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -q

      - name: Examples are reproducible from the generator
        run: |
          python scripts/make_examples.py
          git diff --exit-code examples/

      # Install the package so the console script and bundled catalogs are exercised, then publish
      # the example assessments and the v1 -> v2 comparison on the run's summary page.
      - name: Sample assessment and release comparison
        run: |
          pip install .
          redteam-evidence assess examples/v1 --system "Acme Support Assistant" --version v1 --out out/v1
          redteam-evidence assess examples/v2 --system "Acme Support Assistant" --version v2 --out out/v2
          redteam-evidence compare out/v1/summary.json out/v2/summary.json --out out/comparison.md
          cat out/comparison.md out/v2/report.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sample-assessment
          path: out/
